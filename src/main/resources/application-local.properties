# ==========================================================
# Perfil de desenvolvimento local.
#
# Os valores abaixo servem apenas para rodar o projeto na sua
# maquina, contra o Postgres do compose.yaml. Nenhum deles deve
# existir em qualquer ambiente exposto a internet.
# ==========================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/heracles_db
spring.datasource.username=admin
spring.datasource.password=adminpassword

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave de desenvolvimento. Em producao, JWT_SECRET vem do ambiente.
heracles.security.jwt.secret=chave-de-desenvolvimento-local-heracles-nao-use-em-producao

heracles.cors.allowed-origins=http://localhost:4200

# Cria um administrador inicial caso a base esteja vazia, para que
# seja possivel autenticar logo apos rodar as migracoes.
heracles.seed.admin.enabled=true
heracles.seed.admin.email=admin@heracles.com.br
heracles.seed.admin.senha=Heracles@2026
