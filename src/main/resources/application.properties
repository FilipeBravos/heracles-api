spring.application.name=heracles-api

# O perfil "local" traz valores de desenvolvimento prontos para uso.
# Em producao, defina SPRING_PROFILES_ACTIVE=prod e as variaveis de ambiente abaixo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===============================
# BANCO DE DADOS (PostgreSQL)
# ===============================
# Sem valor padrao de proposito: a aplicacao falha no startup se o segredo
# nao estiver no ambiente, em vez de subir com uma credencial conhecida.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# validate: garante que o Hibernate nao vai criar ou apagar tabelas sozinho.
# O schema e responsabilidade exclusiva das migracoes Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# SEGURANCA (JWT)
# ===============================
# Chave HMAC de no minimo 32 bytes, usada para assinar e validar os tokens.
heracles.security.jwt.secret=${JWT_SECRET}
heracles.security.jwt.expiracao=PT8H

# ===============================
# CORS
# ===============================
heracles.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# REGUA DE COBRANCA
# ===============================
# Dias de tolerancia depois do vencimento antes do job diario marcar a
# assinatura como INADIMPLENTE sozinho. Cinco dias cobre quem paga com
# um pequeno atraso sem que a secretaria precise agir a toda vencida do
# dia — quem passa disso e que entra na regua de cobranca de verdade.
heracles.inadimplencia.dias-tolerancia=${INADIMPLENCIA_DIAS_TOLERANCIA:5}
